; PlatformIO Project Configuration File
;
; Three-cell local mesh prototype for ESP32 + RS485 + Wi-Fi AP.
;
; Firmware environments: site_a, site_b, site_c (same source, per-site flags).
; Host test environment: native (unit tests for the transport core, no board).
;
; See README.md for the wiring, the protocol and the PowerShell commands.

[platformio]
default_envs = site_a, site_b, site_c

; Shared settings for the three ESP32 stations.
; NOTE: kept in a named section (not [env]) so that [env:native] does not
; inherit "board = esp32dev" / "framework = arduino".
[firmware]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
; 115200 is much more reliable than 460800 on CH340/CP210x clones and long
; USB cables: a drop during the flash write makes esptool abort with
; "The chip stopped responding".
upload_speed = 115200
lib_extra_dirs = lib
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
build_flags = -std=gnu++17 -Isrc/common

; ---------------------------------------------------------------------------
; Wi-Fi backbone shared by the three stations (cross-cell call signalling and
; call audio). See README section 18.
;
; APP_WIFI_CHANNEL: an ESP32 has a single radio, so the access point and the
; station interface MUST use the same channel. All three stations therefore
; advertise their AP on this channel.
; APP_LINK_PORT: TCP port of the inter-station link. 8080/8081 are unchanged.
; APP_LINK_TOKEN: shared secret authenticating the stations between each other.
;
; !! DEMONSTRATION VALUE !! Replace APP_LINK_TOKEN (and the APP_WIFI_PASSWORD /
; APP_LINK_UPSTREAM_PASSWORD below) before any real deployment. A token that is
; still the demo value is reported as a warning at boot.
; ---------------------------------------------------------------------------
link_flags =
    -DAPP_WIFI_CHANNEL=1
    -DAPP_LINK_PORT=8082
    -DAPP_LINK_RETRY_MS=2000
    -DAPP_LINK_TOKEN=\"cellnet-demo-link-token\"

; ---------------------------------------------------------------------------
; Backbone topology: a star. SITE_A is the hub: it only advertises its access
; point. SITE_B and SITE_C attach to it with their station interface
; (APP_LINK_UPSTREAM_NODE / SSID / PASSWORD) and reach each other through it.
; The topology is a configuration choice: setting APP_LINK_UPSTREAM_NODE of
; SITE_C to 2 would build a chain instead, without any code change.
; ---------------------------------------------------------------------------

; Hub of the star: no upstream station, so no station interface is opened.
[env:site_a]
extends = firmware
build_flags =
    ${firmware.build_flags}
    ${firmware.link_flags}
    -DSITE_NODE_ID=1
    -DSITE_ID=\"SITE_A\"
    -DSITE_NAME=\"CELL_SITE_A\"
    -DAPP_WIFI_SSID=\"CELL_SITE_A\"
    -DAPP_WIFI_PASSWORD=\"cellsitea\"
    -DAPP_AP_IP=\"10.0.0.1\"
    -DWEBSOCKETS_SERVER_CLIENT_MAX=6
    -DAPP_SERVICE_PORT=8080
    -DAPP_WS_PORT=8081
    -DAPP_RS485_TERMINATED=1
    -DAPP_LINK_UPSTREAM_NODE=0
    -DAPP_LINK_UPSTREAM_SSID=\"\"
    -DAPP_LINK_UPSTREAM_PASSWORD=\"\"
    -DAPP_LINK_UPSTREAM_IP=\"10.0.0.1\"

; Attaches to the access point of SITE_A (10.0.0.1) and opens the link there.
[env:site_b]
extends = firmware
build_flags =
    ${firmware.build_flags}
    ${firmware.link_flags}
    -DSITE_NODE_ID=2
    -DSITE_ID=\"SITE_B\"
    -DSITE_NAME=\"CELL_SITE_B\"
    -DAPP_WIFI_SSID=\"CELL_SITE_B\"
    -DAPP_WIFI_PASSWORD=\"cellsiteb\"
    -DAPP_AP_IP=\"10.1.0.1\"
    -DAPP_SERVICE_PORT=8080
    -DAPP_WS_PORT=8081
    -DWEBSOCKETS_SERVER_CLIENT_MAX=6
    -DAPP_RS485_TERMINATED=0
    -DAPP_LINK_UPSTREAM_NODE=1
    -DAPP_LINK_UPSTREAM_SSID=\"CELL_SITE_A\"
    -DAPP_LINK_UPSTREAM_PASSWORD=\"cellsitea\"
    -DAPP_LINK_UPSTREAM_IP=\"10.0.0.1\"

; Attaches to the access point of SITE_A (10.0.0.1) and opens the link there.
[env:site_c]
extends = firmware
build_flags =
    ${firmware.build_flags}
    ${firmware.link_flags}
    -DSITE_NODE_ID=3
    -DSITE_ID=\"SITE_C\"
    -DSITE_NAME=\"CELL_SITE_C\"
    -DAPP_WIFI_SSID=\"CELL_SITE_C\"
    -DAPP_WIFI_PASSWORD=\"cellsitec\"
    -DAPP_AP_IP=\"10.2.0.1\"
    -DAPP_SERVICE_PORT=8080
    -DAPP_WS_PORT=8081
    -DWEBSOCKETS_SERVER_CLIENT_MAX=6
    -DAPP_RS485_TERMINATED=1
    -DAPP_LINK_UPSTREAM_NODE=1
    -DAPP_LINK_UPSTREAM_SSID=\"CELL_SITE_A\"
    -DAPP_LINK_UPSTREAM_PASSWORD=\"cellsitea\"
    -DAPP_LINK_UPSTREAM_IP=\"10.0.0.1\"

; Host-side unit tests: pio test -e native
; The platform neutral libraries (lib/cell_protocol, lib/cell_core) are
; exercised without any ESP32 hardware.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNIT_TEST -static -static-libgcc -static-libstdc++
build_src_filter = -<*>
test_build_src = no
lib_extra_dirs = lib
extra_scripts = scripts/native_toolchain.py
