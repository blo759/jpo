name: Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run JVM unit tests (resumable transfers, chunking, outbox policy)
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug and release APK
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellnet-unit-tests
          path: mobile/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Verify build output
        run: |
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cellnet-apk
          path: |
            mobile/app/build/outputs/apk/debug/*.apk
            mobile/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
